services:
  - type: web
    name: hospital-erp
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: starter # disks require a paid plan — not available on "free"
    healthCheckPath: /api/health
    disk:
      name: hospital-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////var/data/hospital.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_MODE
        value: "false"
