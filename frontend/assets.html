<title>Asset Register — Hospital Finance</title>
<link rel="stylesheet" href="/css/style.css" />

<div class="app-shell">
  <div class="sidebar" id="sidebar-root"></div>
  <div class="main">
    <div class="topbar" id="topbar-root"></div>
    <div id="alerts"></div>

    <div class="card" id="form-card">
      <h2 id="form-title">Register asset</h2>
      <form id="asset-form">
        <div class="grid grid-3">
          <div class="form-row"><label>Asset name</label><input id="a_name" required /></div>
          <div class="form-row"><label>Department</label><input id="a_department" required /></div>
          <div class="form-row"><label>Acquisition date</label><input type="date" id="a_acquisition_date" required /></div>
          <div class="form-row"><label>Cost</label><input type="number" step="0.01" min="0" id="a_cost" required /></div>
          <div class="form-row"><label>Currency</label>
            <select id="a_currency"><option value="USD">USD</option><option value="ZWG">ZWG</option></select>
          </div>
          <div class="form-row"><label>Netbook value</label><input type="number" step="0.01" min="0" id="a_netbook_value" required /></div>
        </div>
        <div class="mt-16">
          <button class="btn" type="submit" id="form-submit">Register asset</button>
          <button class="btn secondary" type="button" id="cancel-edit" hidden>Cancel</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>Assets</h2>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Asset ID</th><th>Name</th><th>Department</th><th>Cost</th><th>Netbook value</th><th>Status</th><th></th></tr></thead>
          <tbody id="assets-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/currency.js"></script>
<script src="/js/nav.js"></script>
<script>
  let currentUser = null;
  let assets = [];
  let editingId = null;

  function resetForm() {
    editingId = null;
    document.getElementById("asset-form").reset();
    document.getElementById("form-title").textContent = "Register asset";
    document.getElementById("form-submit").textContent = "Register asset";
    document.getElementById("cancel-edit").hidden = true;
    document.getElementById("a_currency").disabled = false;
  }

  function startEdit(asset) {
    editingId = asset.id;
    document.getElementById("a_name").value = asset.asset_name;
    document.getElementById("a_department").value = asset.department;
    document.getElementById("a_acquisition_date").value = asset.acquisition_date;
    document.getElementById("a_cost").value = asset.cost;
    document.getElementById("a_currency").value = asset.currency_code;
    document.getElementById("a_currency").disabled = true;
    document.getElementById("a_netbook_value").value = asset.netbook_value;
    document.getElementById("form-title").textContent = `Edit ${asset.asset_name}`;
    document.getElementById("form-submit").textContent = "Save changes";
    document.getElementById("cancel-edit").hidden = false;
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  async function toggleStatus(asset) {
    const alerts = document.getElementById("alerts");
    alerts.innerHTML = "";
    try {
      await api.patch(`/assets/${asset.id}`, {
        status: asset.status === "active" ? "disposed" : "active",
      });
      await loadAssets();
      alerts.innerHTML = `<div class="success-banner">Asset ${asset.status === "active" ? "marked disposed" : "reactivated"}.</div>`;
    } catch (err) {
      alerts.innerHTML = `<div class="error-banner">${escapeHtml(err.detail || "Could not update asset")}</div>`;
    }
  }

  async function loadAssets() {
    assets = await api.get(`/assets?branch_id=${currentUser.branch_id}`);
    document.getElementById("assets-body").innerHTML = assets
      .map(
        (a) => `<tr>
          <td>${escapeHtml(a.asset_code)}</td>
          <td>${escapeHtml(a.asset_name)}</td>
          <td>${escapeHtml(a.department)}</td>
          <td>${formatMoney(a.cost, a.currency_code)}</td>
          <td>${formatMoney(a.netbook_value, a.currency_code)}</td>
          <td>${statusBadge(a.status)}</td>
          <td>
            ${
              ["admin", "accountant"].includes(currentUser.role)
                ? `<a href="#" class="edit-link" data-id="${a.id}">Edit</a> &middot;
            <a href="#" class="toggle-link" data-id="${a.id}">${a.status === "active" ? "Dispose" : "Reactivate"}</a>`
                : ""
            }
          </td>
        </tr>`
      )
      .join("");

    document.querySelectorAll(".edit-link").forEach((link) =>
      link.addEventListener("click", (e) => {
        e.preventDefault();
        startEdit(assets.find((asset) => asset.id === Number(link.dataset.id)));
      })
    );
    document.querySelectorAll(".toggle-link").forEach((link) =>
      link.addEventListener("click", (e) => {
        e.preventDefault();
        toggleStatus(assets.find((asset) => asset.id === Number(link.dataset.id)));
      })
    );
  }

  (async () => {
    currentUser = await initPage("Asset Register");
    if (!currentUser) return;
    if (!["admin", "accountant"].includes(currentUser.role)) {
      document.getElementById("form-card").style.display = "none";
    }
    await loadAssets();

    document.getElementById("cancel-edit").addEventListener("click", resetForm);

    document.getElementById("asset-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const alerts = document.getElementById("alerts");
      alerts.innerHTML = "";
      const payload = {
        asset_name: document.getElementById("a_name").value,
        department: document.getElementById("a_department").value,
        acquisition_date: document.getElementById("a_acquisition_date").value,
        cost: Number(document.getElementById("a_cost").value),
        netbook_value: Number(document.getElementById("a_netbook_value").value),
      };
      try {
        if (editingId) {
          await api.patch(`/assets/${editingId}`, payload);
          alerts.innerHTML = `<div class="success-banner">Asset updated.</div>`;
        } else {
          payload.branch_id = currentUser.branch_id;
          payload.currency_code = document.getElementById("a_currency").value;
          await api.post("/assets", payload);
          alerts.innerHTML = `<div class="success-banner">Asset registered.</div>`;
        }
        resetForm();
        await loadAssets();
      } catch (err) {
        alerts.innerHTML = `<div class="error-banner">${escapeHtml(err.detail || "Could not save asset")}</div>`;
      }
    });
  })();
</script>
