<title>Dashboard — Hospital Finance</title>
<link rel="stylesheet" href="/css/style.css" />

<div class="app-shell">
  <div class="sidebar" id="sidebar-root"></div>
  <div class="main">
    <div class="topbar" id="topbar-root"></div>
    <div id="content">
      <div class="grid grid-3">
        <div class="card stat-tile">
          <div class="label">Trial Balance (Debit)</div>
          <div class="value" id="tb-debit">—</div>
        </div>
        <div class="card stat-tile">
          <div class="label">Trial Balance (Credit)</div>
          <div class="value" id="tb-credit">—</div>
        </div>
        <div class="card stat-tile warn">
          <div class="label">Outstanding AR</div>
          <div class="value" id="ar-total">—</div>
        </div>
      </div>

      <div class="card">
        <h2>Quick actions</h2>
        <a class="btn" href="/billing.html">New Invoice</a>
        &nbsp;<a class="btn secondary" href="/deposits.html">Take Deposit</a>
        &nbsp;<a class="btn secondary" href="/patients.html">Register Patient</a>
        &nbsp;<a class="btn secondary" href="/daily-transactions.html">Daily Transactions</a>
      </div>

      <div class="card chart-card">
        <h2>Revenue — last 30 days</h2>
        <div id="chart-revenue-trend"></div>
      </div>

      <div class="grid grid-2">
        <div class="card chart-card">
          <h2>Revenue by category</h2>
          <p class="card-subtitle">All-time, current branch scope</p>
          <div id="chart-revenue-category"></div>
        </div>
        <div class="card chart-card">
          <h2>AR aging</h2>
          <p class="card-subtitle">Outstanding balances by age</p>
          <div id="chart-ar-aging"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/currency.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/charts.js"></script>
<script>
  (async () => {
    const user = await initPage("Dashboard");
    if (!user) return;
    try {
      const tb = await api.get("/reports/trial-balance");
      document.getElementById("tb-debit").textContent = formatMoney(tb.total_debit, "");
      document.getElementById("tb-credit").textContent = formatMoney(tb.total_credit, "");
      if (!tb.is_balanced) {
        document.getElementById("content").insertAdjacentHTML(
          "afterbegin",
          `<div class="error-banner">Trial balance is out of balance — this should never happen. Contact an administrator.</div>`
        );
      }
    } catch (err) {
      console.error(err);
    }
    try {
      const ar = await api.get("/reports/ar-aging");
      document.getElementById("ar-total").textContent = formatMoney(ar.grand_total, "");

      const buckets = [
        { label: "0–30 days", value: 0, color: "#86b6ef" },
        { label: "31–60 days", value: 0, color: "#3987e5" },
        { label: "61–90 days", value: 0, color: "#1c5cab" },
        { label: "90+ days", value: 0, color: "#0d366b" },
      ];
      for (const row of ar.rows) {
        buckets[0].value += Number(row.bucket_0_30);
        buckets[1].value += Number(row.bucket_31_60);
        buckets[2].value += Number(row.bucket_61_90);
        buckets[3].value += Number(row.bucket_90_plus);
      }
      renderBarChart(document.getElementById("chart-ar-aging"), buckets, { colorSteps: buckets.map((b) => b.color) });
    } catch (err) {
      console.error(err);
    }
    try {
      const trend = await api.get("/reports/revenue-trend?days=30");
      renderAreaChart(document.getElementById("chart-revenue-trend"), trend.points);
    } catch (err) {
      console.error(err);
    }
    try {
      const income = await api.get("/reports/income-statement");
      const rows = income.income_lines
        .map((line) => ({ label: line.account_name.replace(/^Revenue - /, ""), value: Number(line.amount) }))
        .sort((a, b) => b.value - a.value);
      renderBarChart(document.getElementById("chart-revenue-category"), rows);
    } catch (err) {
      console.error(err);
    }
  })();
</script>
