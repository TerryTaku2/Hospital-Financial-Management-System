<title>Change Password — Hospital Finance</title>
<link rel="stylesheet" href="/css/style.css" />

<div class="app-shell">
  <div class="sidebar" id="sidebar-root"></div>
  <div class="main">
    <div class="topbar" id="topbar-root"></div>
    <div id="alerts"></div>

    <div class="card" style="max-width:420px">
      <h2>Change your password</h2>
      <form id="change-password-form">
        <div class="form-row"><label>Current password</label><input type="password" id="current_password" autocomplete="current-password" required /></div>
        <div class="form-row"><label>New password</label><input type="password" id="new_password" autocomplete="new-password" minlength="8" required /></div>
        <div class="form-row"><label>Confirm new password</label><input type="password" id="confirm_password" autocomplete="new-password" minlength="8" required /></div>
        <p class="text-muted" style="margin-top:-8px">At least 8 characters.</p>
        <button class="btn" type="submit" id="submit-btn">Update password</button>
      </form>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/currency.js"></script>
<script src="/js/nav.js"></script>
<script>
  (async () => {
    const user = await initPage("Change Password");
    if (!user) return;

    document.getElementById("change-password-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const alerts = document.getElementById("alerts");
      alerts.innerHTML = "";

      const currentPassword = document.getElementById("current_password").value;
      const newPassword = document.getElementById("new_password").value;
      const confirmPassword = document.getElementById("confirm_password").value;

      if (newPassword !== confirmPassword) {
        alerts.innerHTML = `<div class="error-banner">New password and confirmation do not match.</div>`;
        return;
      }

      const submitBtn = document.getElementById("submit-btn");
      submitBtn.disabled = true;
      try {
        await api.post("/auth/change-password", { current_password: currentPassword, new_password: newPassword });
        e.target.reset();
        alerts.innerHTML = `<div class="success-banner">Password updated.</div>`;
      } catch (err) {
        alerts.innerHTML = `<div class="error-banner">${escapeHtml(err.detail || "Could not update password")}</div>`;
      } finally {
        submitBtn.disabled = false;
      }
    });
  })();
</script>
