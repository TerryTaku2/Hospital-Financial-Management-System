<title>AP Aging — Hospital Finance</title>
<link rel="stylesheet" href="/css/style.css" />

<div class="app-shell">
  <div class="sidebar" id="sidebar-root"></div>
  <div class="main">
    <div class="topbar" id="topbar-root"></div>

    <div class="card">
      <div class="flex-between">
        <h2>Accounts Payable Aging</h2>
        <div id="branch-filter-row" style="display:none">
          <label class="text-muted" style="font-size:12px">Branch</label>
          <select id="branch-filter" style="width:auto; display:inline-block"><option value="">All branches</option></select>
        </div>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Creditor</th><th>0-30</th><th>31-60</th><th>61-90</th><th>90+</th><th>Total</th></tr></thead>
          <tbody id="ap-body"></tbody>
          <tfoot><tr id="ap-totals-row" style="border-top:2px solid var(--color-border); font-weight:700"></tr></tfoot>
        </table>
      </div>
      <p class="text-right" id="ap-total"></p>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/currency.js"></script>
<script src="/js/nav.js"></script>
<script>
  async function loadApAging(branchId) {
    const qs = branchId ? `?branch_id=${branchId}` : "";
    const ap = await api.get(`/reports/ap-aging${qs}`);
    document.getElementById("ap-body").innerHTML = ap.rows
      .map(
        (r) => `<tr><td>${escapeHtml(r.creditor_name)}</td><td>${formatMoney(r.bucket_0_30, "")}</td>
          <td>${formatMoney(r.bucket_31_60, "")}</td><td>${formatMoney(r.bucket_61_90, "")}</td><td>${formatMoney(r.bucket_90_plus, "")}</td>
          <td>${formatMoney(r.total_outstanding, "")}</td></tr>`
      )
      .join("");

    const totals = ap.rows.reduce(
      (acc, r) => {
        acc.b0_30 += Number(r.bucket_0_30);
        acc.b31_60 += Number(r.bucket_31_60);
        acc.b61_90 += Number(r.bucket_61_90);
        acc.b90_plus += Number(r.bucket_90_plus);
        return acc;
      },
      { b0_30: 0, b31_60: 0, b61_90: 0, b90_plus: 0 }
    );
    document.getElementById("ap-totals-row").innerHTML = `
      <td>Totals</td>
      <td>${formatMoney(totals.b0_30, "")}</td>
      <td>${formatMoney(totals.b31_60, "")}</td>
      <td>${formatMoney(totals.b61_90, "")}</td>
      <td>${formatMoney(totals.b90_plus, "")}</td>
      <td>${formatMoney(ap.grand_total, "")}</td>
    `;
    document.getElementById("ap-total").textContent = `Grand total outstanding: ${formatMoney(ap.grand_total, "")}`;
  }

  (async () => {
    const user = await initPage("AP Aging");
    if (!user) return;

    if (user.can_view_all_branches) {
      const branches = await api.get("/branches");
      document.getElementById("branch-filter-row").style.display = "block";
      document.getElementById("branch-filter").insertAdjacentHTML(
        "beforeend",
        branches.map((b) => `<option value="${b.id}">${escapeHtml(b.name)}</option>`).join("")
      );
      document.getElementById("branch-filter").addEventListener("change", (e) => loadApAging(e.target.value));
    }

    await loadApAging();
  })();
</script>
