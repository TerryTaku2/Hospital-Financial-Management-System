<title>Trial Balance — Hospital Finance</title>
<link rel="stylesheet" href="/css/style.css" />

<div class="app-shell">
  <div class="sidebar" id="sidebar-root"></div>
  <div class="main">
    <div class="topbar" id="topbar-root"></div>

    <div class="card">
      <div class="flex-between">
        <h2>Trial Balance</h2>
        <div id="branch-filter-row" style="display:none">
          <label class="text-muted" style="font-size:12px">Branch</label>
          <select id="branch-filter" style="width:auto; display:inline-block"><option value="">All branches</option></select>
        </div>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Code</th><th>Account</th><th>Debit</th><th>Credit</th></tr></thead>
          <tbody id="tb-body"></tbody>
        </table>
      </div>
      <p class="text-right" id="tb-total"></p>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/currency.js"></script>
<script src="/js/nav.js"></script>
<script>
  async function loadTrialBalance(branchId) {
    const qs = branchId ? `?branch_id=${branchId}` : "";
    const tb = await api.get(`/reports/trial-balance${qs}`);
    document.getElementById("tb-body").innerHTML = tb.lines
      .map(
        (l) => `<tr><td>${l.account_code}</td><td>${escapeHtml(l.account_name)}</td><td>${formatMoney(l.total_debit, "")}</td><td>${formatMoney(l.total_credit, "")}</td></tr>`
      )
      .join("");
    document.getElementById("tb-total").innerHTML =
      `Total: ${formatMoney(tb.total_debit, "")} / ${formatMoney(tb.total_credit, "")} ${tb.is_balanced ? "✓ balanced" : "⚠ NOT BALANCED"}`;
  }

  (async () => {
    const user = await initPage("Trial Balance");
    if (!user) return;

    if (user.can_view_all_branches) {
      const branches = await api.get("/branches");
      document.getElementById("branch-filter-row").style.display = "block";
      document.getElementById("branch-filter").insertAdjacentHTML(
        "beforeend",
        branches.map((b) => `<option value="${b.id}">${escapeHtml(b.name)}</option>`).join("")
      );
      document.getElementById("branch-filter").addEventListener("change", (e) => loadTrialBalance(e.target.value));
    }

    await loadTrialBalance();
  })();
</script>
